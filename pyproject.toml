[project]
name = "bakhuis-site-tools"
version = "0.0.0"
description = "Installs divelog-server so the `divelog` CLI runs from this checkout (`uv run divelog …`, `make tiles`)"
requires-python = ">=3.13"
dependencies = [
  "divelog-server",
]

[tool.uv]
package = false

[tool.uv.sources]
divelog-server = { path = "../divelog/packages/server", editable = true }
