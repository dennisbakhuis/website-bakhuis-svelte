[project]
name = "bakhuis-site-tools"
version = "0.0.0"
description = "One-off data scripts of dennisbakhuis.nl, run with `uv run python scripts/<name>.py`"
requires-python = ">=3.13"
dependencies = [
  "divelog-server",
  "openpyxl>=3.1",
]

[tool.uv]
package = false

[tool.uv.sources]
divelog-server = { path = "../divelog/packages/server", editable = true }
