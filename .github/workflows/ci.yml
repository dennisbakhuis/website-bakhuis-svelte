name: CI

# Runs on every PR targeting main/dev so lint/format/type/unit-test
# regressions surface before merge. The post-merge push to main/dev is
# already validated by the PR run and would just re-run the same trees,
# so the `push` trigger is intentionally omitted. Release artefacts on
# merge are produced by docker-publish.yml. The backend and the dive-log
# kit (with its API types) are built and tested in the divelog monorepo,
# the blog kit in the blog repo; both arrive here as vendored tarballs in
# vendor/. The posts come from the private website-bakhuis-content repository
# (CONTENT_REPO_TOKEN), checked out inside the workspace and named by CONTENT_DIR.
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  ci:
    name: Frontend — lint, test & build
    runs-on: ubuntu-latest
    env:
      CONTENT_DIR: website-bakhuis-content/posts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout content (posts)
        # The blog posts live in the private content repository (repo variable
        # CONTENT_REPO overrides the name). CONTENT_REPO_TOKEN is a fine-grained
        # PAT with read access to that one repository. Sparse: posts/ and the
        # top-level files only, not the dive log.
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CONTENT_REPO || 'dennisbakhuis/website-bakhuis-content' }}
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          path: website-bakhuis-content
          sparse-checkout: posts
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version consistency — VERSION file is the source of truth
        run: pnpm run version:check

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm check

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Build
        run: pnpm build
