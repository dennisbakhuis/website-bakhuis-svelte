# Local development stack. The SvelteKit dev server runs on the host
# (`pnpm dev`, port 5373) and proxies /api and /media here. The dive log is
# read from a checkout of the private divelog-data repository, a sibling of
# this one by default (DATA_REPO). Production runs the frontend image too —
# see infra/ for the compose file operator-infra deploys.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app
    ports:
      - '127.0.0.1:8300:8000'
    env_file:
      - .env
    environment:
      DEBUG: 'true'
      DATA_ROOT: /data/repo
      STATE_DIR: /data/state
      GIT_ENABLED: 'false'
      APP_VERSION: ${APP_VERSION:-0.0.0-dev}
      TRUSTED_PROXY_IPS: '0.0.0.0/0'
    volumes:
      - ./backend:/app
      - ${DATA_REPO:-../divelog-data}:/data/repo
      - state:/data/state
      - ${MEDIA_DIR:-../divelog-media}:/data/media
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - '127.0.0.1:8325:8025'
      - '127.0.0.1:1325:1025'
    restart: unless-stopped

volumes:
  state:
