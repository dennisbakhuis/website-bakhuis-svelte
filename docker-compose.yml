# Local development stack. The SvelteKit dev server runs on the host
# (`pnpm dev`, port 5373) and proxies /api and /media here. Production runs
# the frontend image too — see infra/ for the compose file operator-infra
# deploys.

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: bakhuis
      POSTGRES_USER: bakhuis
      POSTGRES_PASSWORD: bakhuis
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bakhuis -d bakhuis']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    command: >
      sh -c "alembic upgrade head
      && python -m app.seed
      && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"
    ports:
      - '127.0.0.1:8300:8000'
    env_file:
      - .env
    environment:
      DEBUG: 'true'
      DATABASE_URL: postgresql+asyncpg://bakhuis:bakhuis@db:5432/bakhuis
      APP_VERSION: ${APP_VERSION:-0.0.0-dev}
      TRUSTED_PROXY_IPS: '0.0.0.0/0'
    volumes:
      - ./backend:/app
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - '127.0.0.1:8325:8025'
      - '127.0.0.1:1325:1025'
    restart: unless-stopped

volumes:
  pgdata:
  media:
